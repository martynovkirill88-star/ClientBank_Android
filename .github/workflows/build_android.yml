name: Build RoPay ClientBank Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK and App Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Copy and rename artifacts
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/*.apk release_output/RoPay_ClientBank_Release.apk || cp app/build/outputs/apk/release/* release_output/
          cp app/build/outputs/bundle/release/*.aab release_output/RoPay_ClientBank_Release.aab || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoPay-Android-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoPay-Android-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.22
          name: "RoPay Android v1.0.22 - Store Ready Release (APK & AAB)"
          body: "RoPay Android v1.0.22: Полный клиент мобильного банка RoPay для Android, полностью соответствующий iOS версии: переводы с подтверждением и анти-спам проверкой, динамические кнопки Tele2 с сервера, защищённый встроенный браузер, истории/статусы, биометрия и поддержка."
          files: |
            release_output/RoPay_ClientBank_Release.apk
            release_output/RoPay_ClientBank_Release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
